name: Publication des exécutables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: APK Android release
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Compilation APK release
        run: flutter build apk --release

      - name: Préparation de l’APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "CastFlow-Android-${GITHUB_REF_NAME}.apk"

      - name: Conservation de l’APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: CastFlow-Android-*.apk
          if-no-files-found: error

  windows:
    name: Application Windows release
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Compilation Windows release
        run: flutter build windows --release

      - name: Création du ZIP portable
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "CastFlow-Windows-$env:GITHUB_REF_NAME.zip"

      - name: Conservation du ZIP Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: CastFlow-Windows-*.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des exécutables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --title "CastFlow ${GITHUB_REF_NAME}"
          --generate-notes
          --latest
