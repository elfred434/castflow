# ==========================================================================
# CastFlow — Publication d'une version
#
# Déclenché par un tag (v0.1.0, v1.2.3…) ou manuellement depuis l'onglet
# Actions. Rejoue la suite de tests avant de publier, pour ne jamais livrer
# une version cassée.
# ==========================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la release GitHub

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  release:
    name: Vérifier et publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Suite complète (vérifications + 37 tests)
        run: npm test

      - name: Build de production
        run: npm run build:desktop

      - name: Archive de l'interface desktop
        run: |
          cd apps/desktop/dist
          zip -r "../../../castflow-desktop-${GITHUB_REF_NAME}.zip" .
          cd -
          ls -lh castflow-desktop-*.zip

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: castflow-desktop-${{ github.ref_name }}
          path: castflow-desktop-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Création de la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: castflow-desktop-*.zip
          generate_release_notes: true
          body: |
            ## CastFlow ${{ github.ref_name }}

            Transfert de fichiers local entre desktop et mobile.

            Cette version a passé les 37 tests automatisés (serveur, sécurité,
            reprise, intégrité, réception et bout-en-bout mobile ↔ desktop).

            **Contenu de l'archive** : interface desktop compilée.
            Pour lancer l'application complète, voir le README.
