# ==========================================================================
# CastFlow — Intégration continue (GitHub Actions)
#
#   verify  → syntaxe, cohérence du protocole, types TypeScript, config mobile
#   test    → tests d'intégration (serveur) + bout-en-bout (mobile ↔ desktop)
#   build   → build de production de l'UI desktop, publié en artefact
# ==========================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # permet un lancement manuel depuis l'onglet Actions

# Un nouveau push sur une branche annule le pipeline précédent encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Electron pèse ~100 Mo et ne sert qu'au lancement local de l'app :
  # inutile de le télécharger ici (tests et build s'en passent).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  # ------------------------------------------------------------------
  # VERIFY — analyses statiques, rapides
  # ------------------------------------------------------------------
  verify:
    name: Vérifications statiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Syntaxe de tout le code JS/JSX (desktop + mobile)
        run: npm run check:syntax

      - name: Cohérence du protocole entre desktop, mobile et paquet partagé
        run: npm run check:protocol

      - name: Configuration de l'application mobile (permissions, Expo)
        run: npm run check:mobile

      - name: Compilation TypeScript du paquet partagé
        run: npm run build:shared

  # ------------------------------------------------------------------
  # TEST — le cœur du pipeline, sur deux versions de Node
  # ------------------------------------------------------------------
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Tests d'intégration du serveur (HTTP, WebSocket, UDP, sécurité)
        run: npm run test:core

      - name: Tests bout-en-bout (client mobile réel ↔ serveur desktop réel)
        run: npm run test:e2e

  # ------------------------------------------------------------------
  # BUILD — l'UI desktop doit compiler
  # ------------------------------------------------------------------
  build:
    name: Build desktop
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build de production de l'interface desktop
        run: npm run build:desktop

      - name: Vérification de l'artefact produit
        run: |
          test -f apps/desktop/dist/index.html || {
            echo "::error::Build introuvable dans apps/desktop/dist/"
            exit 1
          }
          du -sh apps/desktop/dist/

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: castflow-desktop-${{ github.sha }}
          path: apps/desktop/dist/
          retention-days: 7
          if-no-files-found: error
