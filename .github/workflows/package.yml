name: Installateurs Flutter Windows et Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-flutter-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  verify:
    name: Analyse et 24 tests Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  windows:
    name: Windows (.exe)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Installation d'Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Création de l'installateur
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([^+]+)'
          $version = $versionLine.Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "installer\castflow.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }

      - name: Vérification de l'installateur
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "dist/release/*.exe" -File)
          if ($files.Count -lt 1) { throw "Aucun installateur .exe produit" }
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "{0}  {1} octets  SHA256:{2}" -f $_.Name, $_.Length, $hash
          }

      - name: Publication du .exe
        uses: actions/upload-artifact@v7
        with:
          name: castflow-windows-${{ github.run_number }}
          path: dist/release/*.exe
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installation du SDK Android 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configuration facultative de la signature Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "APK interne : utilisation de la clé debug."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/castflow-release.jks
          cat > android/key.properties <<EOF
          storeFile=app/castflow-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build APK release
        run: |
          flutter pub get
          flutter build apk --release

      - name: Préparation de l'APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$source_apk"
          mkdir -p dist/release
          cp "$source_apk" "dist/release/CastFlow-${GITHUB_RUN_NUMBER}.apk"
          unzip -t dist/release/*.apk >/dev/null
          sha256sum dist/release/*.apk

      - name: Publication de l'APK
        uses: actions/upload-artifact@v7
        with:
          name: castflow-android-${{ github.run_number }}
          path: dist/release/*.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: castflow-windows-${{ github.run_number }}
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: castflow-android-${{ github.run_number }}
          path: release

      - name: Sommes SHA-256
        run: sha256sum release/* | tee release/SHA256SUMS.txt

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## CastFlow ${{ github.ref_name }}

            Application Flutter commune pour Windows et Android.
            Les 24 tests Flutter ont réussi avant la construction.
