name: castflow
description: Transfert de fichiers local entre Windows et Android
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_picker: ^12.0.0
  flutter_riverpod: ^2.6.1
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: assets/icon.png
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
